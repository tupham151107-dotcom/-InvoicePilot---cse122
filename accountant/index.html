<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kế toán · InvoicePilot</title>
  <link rel="stylesheet" href="../common/common.css" />
  <link rel="stylesheet" href="accountant.css" />
</head>
<body>
  <div id="workspace"></div>
  <template id="role-content">
    <section class="role-heading"><div><span class="eyebrow">KẾ TOÁN</span><h1>Hóa đơn &amp; thanh toán</h1><p>Theo dõi hóa đơn phát hành, khoản thu và đối chiếu thanh toán.</p></div><button class="button button-primary accountant-action" data-accountant-action="new-invoice">+ Tạo hóa đơn</button></section>
    <section class="role-stats"><article class="role-card"><small>Hóa đơn cần xử lý</small><strong>8</strong><span>3 hóa đơn sắp đến hạn</span></article><article class="role-card"><small>Khoản đã thu tháng này</small><strong>115.700.000 ₫</strong><span class="positive">↑ 12,5% so với kỳ trước</span></article><article class="role-card"><small>Chờ đối chiếu</small><strong>4</strong><span>21.500.000 ₫</span></article></section>
    <section class="role-panel"><div class="role-panel-heading"><div><h2>Hóa đơn gần đây</h2><p>Quản lý hóa đơn và ghi nhận thanh toán.</p></div><input class="role-search" type="search" placeholder="Tìm mã hóa đơn hoặc khách hàng" data-accountant-search /></div><div class="table-scroll"><table class="role-table"><thead><tr><th>Mã hóa đơn</th><th>Khách hàng</th><th>Ngày đến hạn</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr></thead><tbody data-accountant-rows></tbody></table></div></section>
    <div class="role-message" data-accountant-message role="status"></div>
  </template>
  <script src="../common/common.js"></script>
  <script src="accountant.js"></script>
</body>
</html>
