<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký · 19 InvoicePilot</title>
  <link rel="stylesheet" href="common.css" />
</head>
<body class="signup-page">
  <main class="signup-card">
    <a class="brand brand-dark" href="index.html"><span class="brand-mark">IP</span><span>InvoicePilot</span></a>
    <span class="eyebrow">BẮT ĐẦU SỬ DỤNG</span>
    <h1>Đăng ký doanh nghiệp</h1>
    <p class="muted">Tạo không gian làm việc cho đội ngũ của bạn.</p>
    <form id="signup-form" class="signup-grid">
      <label class="field-group field-wide">Tên doanh nghiệp<input name="company" placeholder="Công ty TNHH Ánh Dương" required /></label>
      <label class="field-group">Mã số thuế<input name="tax" placeholder="0312345678" required /></label>
      <label class="field-group">Người đại diện<input name="owner" placeholder="Nguyễn Minh Quân" required /></label>
      <label class="field-group field-wide">Email quản trị<input type="email" name="email" placeholder="quan@congty.vn" required /></label>
      <label class="field-group field-wide">Vai trò<select name="role" required><option value="" selected disabled>Chọn vai trò</option><option value="admin">Quản trị viên</option><option value="manager">Quản lý</option><option value="accountant">Kế toán</option><option value="sales">Kinh doanh</option></select></label>
      <label class="field-group">Mật khẩu<input type="password" name="password" minlength="8" required /></label>
      <label class="field-group">Xác nhận mật khẩu<input type="password" name="confirm" minlength="8" required /></label>
      <label class="check-label field-wide"><input type="checkbox" required /> Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật.</label>
      <button class="button button-primary field-wide" type="submit">Tạo tài khoản</button>
    </form>
    <div class="form-footer">Đã có tài khoản? <a href="index.html">Đăng nhập</a></div>
    <div class="form-message" id="signup-message" role="status" aria-live="polite"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="common.js"></script>
</body>
</html>
